<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio of Eshwar — Software Developer" />
  <title>Eshwar | Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1 class="name">Eshwar</h1>
      <p class="title">Software Developer</p>
      <a href="#contact" class="cta-button">Contact Me</a>
    </div>
  </header>

  <section id="contact" class="contact">
    <div class="container">
      <h2>Contact</h2>
      <p>You can reach me at <a href="mailto:eshwar@example.com">eshwar@example.com</a></p>
      <form id="contact-form">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">© 2024 Eshwar. All rights reserved.</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
